</head>
<body>

          <div class="parent">
            <div class="div1"> <video autoplay muted loop playsinline class="header">  <source src="images/circus.mp4" type="video/mp4"></div>

              <div class="div6">
                <div class="atropos my-atropos">
                  <div class="atropos-scale">
                    <div class="atropos-rotate">
                      <div class="atropos-inner">
                        <div class="gallery-item">
                          <img class="polaroid" src="images/sainteculdejatte.png" alt="polaroid" data-overlay="images/sainteculdejatte2.png">
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              
              <div class="div7">
                <div class="atropos my-atropos">
                  <div class="atropos-scale">
                    <div class="atropos-rotate">
                      <div class="atropos-inner">
                        <div class="gallery-item">
                          <img class="polaroid" src="images/saintedouardlebiscornu.png" alt="polaroid" data-overlay="images/saintedouardlebiscornu2.png">

                        </div>

              <div class="div9">

                    <div class="atropos-rotate">
                      <div class="atropos-inner">
                        <div class="gallery-item">

        <script src="https://cdn.jsdelivr.net/npm/atropos@2.0.2/atropos.min.js"></script>

        <script>
        document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".my-atropos").forEach((element) => {
        Atropos({
        el: element,
        activeOffset: 40,
        shadowScale: 1.05,
        highlight: true,
        rotateXMax: 15,
        rotateYMax: 15,
        stretchX: 40,
        stretchY: 40,
    });
  });
});

        </script>

        <script src="parallax3web/script.js"></script>
        <script src="script.js"></script>
  
  </body>
